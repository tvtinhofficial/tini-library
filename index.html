<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>tinilib — repo & skill library for any AI</title>
<meta name="description" content="Save GitHub repos and AI skills, let AI summarize them, and export a library any AI (Claude, ChatGPT, Cursor, Codex) can use.">
<meta property="og:title" content="tinilib — repo & skill library for any AI">
<meta property="og:description" content="Paste a GitHub link, AI summarizes it, export AGENTS.md or connect via MCP. Works with Claude, ChatGPT, Cursor, Codex.">
<meta property="og:image" content="https://tvtinhofficial.github.io/tini-library/assets/social-preview.png">
<meta property="og:url" content="https://tvtinhofficial.github.io/tini-library/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="vendor/lucide.min.js"></script>
<style>
:root{--bg:#F4F5F7;--line:#E8E8EE;--line2:#D6D5DE;--tx:#15121F;--mut:#6B6878;--soft:#F7F7FA;--pri:#0E9F5C;--pri-soft:#E7F7EF;--ink:#15121F;--danger:#D92D20}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.lucide{width:16px;height:16px;stroke-width:2;flex:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line2);background:#fff;border-radius:9px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--tx);font-size:13px;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--soft)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:progress}
.in{height:38px;width:100%;border:1px solid var(--line2);border-radius:9px;padding:0 12px;background:#fff}
textarea.in{height:auto;min-height:110px;padding:10px 12px;resize:vertical}

.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:5}
.top img{height:28px}
.top .search{flex:1;max-width:460px;margin:0 auto;position:relative}
.top .search svg{position:absolute;left:11px;top:11px;color:var(--mut)}
.top .search .in{padding-left:34px;background:var(--soft);border-color:var(--soft)}
.top .search .in:focus{background:#fff;border-color:var(--line2)}
.app{display:grid;grid-template-columns:236px 1fr;gap:14px;max-width:1280px;margin:0 auto;padding:14px}
.app.has-det{grid-template-columns:236px 1fr 360px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px}

.side{padding:10px;display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:70px}
.side h4{margin:12px 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.nav{display:flex;align-items:center;gap:9px;height:36px;padding:0 10px;border-radius:9px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-weight:500}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--pri-soft);color:var(--pri)}
.nav .dot{width:10px;height:10px;border-radius:50%;background:var(--k);flex:none}
.nav .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ct{font-size:12px;color:var(--mut);font-weight:500}
.nav.on .ct{color:var(--pri)}
.nav .ed{opacity:0;padding:2px;border-radius:5px;display:grid}.nav:hover .ed{opacity:1}.nav .ed:hover{background:#fff}
.nav .ed svg{width:14px;height:14px}
.side .foot{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;height:28px;padding:0 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px #0000000f}

.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.add{padding:14px}
.add .row{display:flex;gap:8px}
.add .meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--mut);cursor:pointer;padding:0;text-decoration:underline;font-size:12px}
.list{overflow:hidden}
.lh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.lh b{font-size:15px}.lh span{color:var(--mut);font-size:12px}
.gh{padding:8px 16px 6px;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;background:var(--soft);border-bottom:1px solid var(--line)}
.it{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.it:hover{background:var(--soft)}.it.on{background:var(--pri-soft)}
.av{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 13%,#fff);color:var(--k);flex:none}
.av svg{width:18px;height:18px}
.it .tx{flex:1;min-width:0}
.it .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ds{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--mut);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--k);display:inline-block}
.tag svg{width:11px;height:11px}
.empty{padding:48px 20px;text-align:center;color:var(--mut)}
.empty svg{width:28px;height:28px;margin-bottom:8px}

.det{padding:18px;align-self:start;position:sticky;top:70px;max-height:calc(100vh - 84px);overflow:auto;display:none}
.has-det .det{display:block}
.det .hd{display:flex;gap:12px;align-items:flex-start}
.det h2{font-size:17px;margin:0;word-break:break-word;line-height:1.35}
.det .sub{font-size:12px;color:var(--mut);margin-top:2px}
.det p{margin:14px 0 0;color:#3D3A48}
.det ul{margin:8px 0 0;padding-left:18px;color:#3D3A48}.det li{margin:3px 0}
.det .lb{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.det code{display:block;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;word-break:break-all;white-space:pre-wrap}
.det .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}

#tree{position:relative;overflow:auto;padding:22px;min-height:300px}
#tree svg.ln{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.t{display:flex;align-items:center}.kids{display:flex;flex-direction:column;gap:8px;margin-left:52px}.t.closed>.kids{display:none}
.nd{display:flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:500;cursor:pointer;position:relative;z-index:1}
.nd:hover{border-color:var(--k)}
.nd .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 15%,#fff);color:var(--k)}
.nd .d svg{width:12px;height:12px}
.nd .n{color:var(--mut);font-size:11px;background:var(--soft);border-radius:999px;padding:0 7px}
.nd.root{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;padding:7px 14px 7px 7px}
.nd.root .d{background:#ffffff26;color:#fff}
.nd.br{font-weight:600;border-width:2px;border-color:var(--k)}
.nd.leaf{border-radius:8px}.t.closed>.nd::after{content:"+";color:var(--k);font-weight:700}

.modal{position:fixed;inset:0;background:#15121F59;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.s{display:flex}
.modal>div{background:#fff;border-radius:16px;padding:20px;width:520px;max-width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.modal .note{font-size:12px;color:var(--mut);margin:0 0 14px}
.f{margin-top:12px}.f label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:var(--k);cursor:pointer;box-shadow:0 0 0 1px var(--line2)}
.sw button.on{box-shadow:0 0 0 2px var(--tx)}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.mf .sp{flex:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:30;font-size:13px}
.toast.s{opacity:1;transform:translateX(-50%)}
.xtabs{display:flex;gap:6px;margin-bottom:10px}
.xtabs button{border:1px solid var(--line2);background:#fff;border-radius:8px;height:30px;padding:0 10px;cursor:pointer;font-size:12px;font-weight:500}
.xtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#x-out{font:12px/1.5 ui-monospace,Menlo,monospace;min-height:260px}

.mbar{display:none}
@media (max-width:960px){
 .app,.app.has-det{grid-template-columns:1fr}
 .side{display:none}
 .mbar{display:flex;gap:6px;overflow:auto;padding-bottom:2px}
 .mbar .nav{width:auto;flex:none;background:#fff;border:1px solid var(--line);height:34px}
 .mbar .nav.on{border-color:var(--pri)}
 .det{position:fixed;inset:auto 0 0 0;top:auto;max-height:80vh;border-radius:16px 16px 0 0;z-index:15;box-shadow:0 -10px 30px #0000001f}
 .top .search{display:none}
 .hide-m{display:none}
 .add .row{flex-wrap:wrap}
}
</style></head><body>

<header class="top">
 <img src="assets/logo/tinilib-ngang.svg" alt="tinilib">
 <div class="search"><i data-lucide="search"></i><input class="in" id="q" data-ph="search"></div>
 <button class="btn ghost" id="langBtn"><i data-lucide="languages"></i><span></span></button>
 <button class="btn" data-open="export"><i data-lucide="share-2"></i><span class="hide-m" data-i="export"></span></button>
 <button class="btn icon" data-open="settings" title="Settings"><i data-lucide="settings"></i></button>
</header>

<div class="app" id="app">
 <aside class="panel side" id="side"></aside>

 <main class="main">
  <div class="mbar" id="mbar"></div>
  <section class="panel add">
   <div class="seg" id="addMode" style="width:max-content;max-width:100%;margin-bottom:10px">
    <button data-am="repo" class="on"><i data-lucide="github"></i><span data-i="mRepo"></span></button>
    <button data-am="skill"><i data-lucide="sparkles"></i>Skill</button>
    <button data-am="link"><i data-lucide="link"></i><span data-i="mLink"></span></button>
   </div>
   <div data-pane="repo">
    <div class="row"><input class="in" id="link" data-ph="linkPh"><button class="btn pri" id="addBtn" style="height:38px"><i data-lucide="plus"></i><span data-i="add"></span></button></div>
    <div id="pasteWrap" hidden style="margin-top:8px"><textarea class="in" id="readme" data-ph="pastePh"></textarea></div>
   </div>
   <div data-pane="skill" hidden>
    <textarea class="in" id="skillTxt" data-ph="skillPh"></textarea>
    <div class="row" style="margin-top:8px;justify-content:space-between">
     <label class="btn"><i data-lucide="file-up"></i><span data-i="skillFile"></span><input type="file" id="skillFile" accept=".md,.markdown,.txt" multiple hidden></label>
     <button class="btn pri" id="skillBtn" style="height:38px"><i data-lucide="plus"></i><span data-i="addSkill"></span></button>
    </div>
   </div>
   <div data-pane="link" hidden>
    <div class="row"><input class="in" id="lkName" data-ph="lkName"><input class="in" id="lkUrl" placeholder="https://"></div>
    <div class="row" style="margin-top:8px"><input class="in" id="lkDesc" data-ph="lkDesc"><button class="btn pri" id="lkBtn" style="height:38px"><i data-lucide="plus"></i><span data-i="add"></span></button></div>
   </div>
   <div class="meta"><span id="st"></span><span><span id="aiHint"></span><span id="pasteHint"> · <button class="linkbtn" id="pasteToggle" data-i="pasteToggle"></button></span></span></div>
  </section>

  <section class="panel list" id="listView"></section>
  <section class="panel" id="tree" hidden></section>
 </main>

 <aside class="panel det" id="det"></aside>
</div>

<div class="modal" id="m-settings"><div>
 <h3><i data-lucide="settings"></i><span data-i="settings"></span></h3>
 <p class="note" data-i="keyNote"></p>
 <div class="f"><label data-i="provider"></label>
  <select class="in" id="s-provider">
   <option value="none"></option><option value="openai">OpenAI (ChatGPT)</option><option value="anthropic">Anthropic (Claude)</option>
   <option value="gemini">Google Gemini</option><option value="ollama">Ollama (local)</option><option value="compat">OpenAI-compatible (OpenRouter, Groq, LM Studio…)</option>
  </select></div>
 <div class="f" id="s-keyw"><label>API key</label><input class="in" id="s-key" type="password" autocomplete="off"></div>
 <div class="f"><label>Model</label><input class="in" id="s-model"></div>
 <div class="f" id="s-basew"><label>Base URL</label><input class="in" id="s-base"></div>
 <div class="f"><label>GitHub token <span style="font-weight:400;color:var(--mut)" data-i="optional"></span></label><input class="in" id="s-gh" type="password" autocomplete="off"></div>
 <div class="f"><label data-i="dataTitle"></label>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="d-export"><i data-lucide="download"></i>library.json</button>
  <label class="btn"><i data-lucide="upload"></i><span data-i="import"></span><input type="file" id="d-import" accept=".json" hidden></label>
  <button class="btn" id="d-reset"><i data-lucide="rotate-ccw"></i><span data-i="reset"></span></button></div></div>
 <div class="mf"><button class="btn" data-close data-i="close"></button><button class="btn pri" id="s-save"><i data-lucide="check"></i><span data-i="save"></span></button></div>
</div></div>

<div class="modal" id="m-branch"><div>
 <h3><i data-lucide="git-branch"></i><span id="b-title"></span></h3>
 <p class="note" data-i="branchNote"></p>
 <div class="f"><label data-i="branchName"></label><input class="in" id="b-name" data-ph="branchPh"></div>
 <div class="f"><label data-i="color"></label><div class="sw" id="b-colors"></div></div>
 <div class="mf"><button class="btn danger" id="b-del"><i data-lucide="trash-2"></i><span data-i="delete"></span></button><span class="sp"></span><button class="btn" data-close data-i="close"></button><button class="btn pri" id="b-save"><i data-lucide="check"></i><span data-i="save"></span></button></div>
</div></div>

<div class="modal" id="m-export"><div>
 <h3><i data-lucide="share-2"></i><span data-i="export"></span></h3>
 <p class="note" data-i="exportNote"></p>
 <div class="xtabs"><button class="on" data-x="agents">AGENTS.md</button><button data-x="llms">llms.txt</button><button data-x="json">library.json</button></div>
 <textarea class="in" id="x-out" readonly></textarea>
 <div class="mf"><button class="btn" data-close data-i="close"></button><button class="btn" id="x-dl"><i data-lucide="download"></i><span data-i="download"></span></button><button class="btn pri" id="x-copy"><i data-lucide="copy"></i>Copy</button></div>
</div></div>
<div class="toast" id="toast"></div>

  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);return j.choices[0].message.content}
 if(p==="anthropic"){const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:m,max_tokens:1200,messages:[{role:"user",content:prompt}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);return j.content.map(c=>c.text||"").join("")}
 if(p==="gemini"){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(cfg.key)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.2,responseMimeType:"application/json"}})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);return j.candidates[0].content.parts.map(x=>x.text).join("")}
 if(p==="ollama"){const r=await fetch((cfg.base||DEF.ollama.base)+"/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:m,prompt,stream:false,format:"json"})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j.response}

The user's library has these branches (fields of work):
${brs}

Pick the branch that fits best. If none fits well, propose a new branch name for the field it belongs to.
Return ONE JSON object and nothing else:
{"branch":"an existing branch id from the list, OR \\"new\\"","new_branch":"short name of the new branch if branch is \\"new\\", else empty","group":"short sub-group (reuse an existing group if it fits)","desc":"what it does, 2 sentences","points":["3-5 key points, one short sentence each"],"when":"when to use it, 1 sentence","install":"${kind==="skill"?"leave empty":"shortest install command if present, else empty"}","icon":"one of: ${ICONS.join(", ")}","prompt":"${kind==="skill"?"a ready-to-paste request that would make an AI assistant use this skill for one concrete task":`a ready-to-paste request asking an AI assistant to use github.com/${name} for one concrete task`}"}

CONTENT:
${content.slice(0,60000)}`}
async function aiFill(item,kind,content){
 const r=parseJSON(await ai(summaryPrompt(kind,item.name,content)));
 if(r.branch==="new"&&r.new_branch){let bid=slug(r.new_branch);const ex=LIB.branches.find(b=>b.id===bid||b.name.toLowerCase()===r.new_branch.toLowerCase());
  if(ex)bid=ex.id;else LIB.branches.push({id:bid,name:r.new_branch,color:COLORS[LIB.branches.length%COLORS.length]});item.cat=bid}
 else if(LIB.branches.some(b=>b.id===r.branch))item.cat=r.branch;
 for(const k of["group","desc","points","when","install","icon","prompt"])if(r[k]&&(!Array.isArray(r[k])||r[k].length))item[k]=r[k];
 item.summarized=true}
async function busy(btn,fn){btn.disabled=true;try{await fn()}catch(e){$("#st").textContent="⚠ "+(e.message||e)}btn.disabled=false}

/* ---------- add: repo ---------- */
$("#addBtn").onclick=()=>busy($("#addBtn"),async()=>{
 const m=$("#link").value.match(/github\.com\/([\w.-]+)\/([\w.-]+)/);if(!m)return toast(t("badLink"));
 const name=m[1]+"/"+m[2].replace(/\.git$/,""),st=$("#st");let meta={},content=$("#readme").value.trim();
 if(!content){st.textContent=t("fetching");try{meta=await gh("repos/"+name);content=await gh("repos/"+name+"/readme",true)}catch(e){st.textContent="";toast(t("ghFail"));$("#pasteWrap").hidden=false;return}}
 const item={id:slug(name),type:"repo",name,url:"https://github.com/"+name,cat:targetBranch(),group:"",desc:meta.description||"",stars:meta.stargazers_count,topics:meta.topics,added:new Date().toISOString()};
 if(cfg.provider!=="none"){st.textContent=t("summarizing");await aiFill(item,"repo",(meta.description?meta.description+"\n\n":"")+content)}
 addItem(item);$("#link").value="";$("#readme").value="";$("#pasteWrap").hidden=true;st.textContent="";toast(t("saved")+": "+name)});

/* ---------- add: skill ---------- */
function parseSkill(text,fallback){
 const fm=(text.match(/^﻿?---\r?\n([\s\S]*?)\r?\n---/)||[,""])[1];
 const get=k=>{const m=fm.match(new RegExp("^"+k+":\\s*(.*)$","m"));return m?m[1].trim().replace(/^["'>|]\s*|["']$/g,""):""};
 let name=get("name")||fallback||(text.match(/^#\s+(.+)$/m)||[,""])[1].trim();
 return {name:name||"skill",desc:get("description")}}
async function addSkillText(text,fallback){
 const s=parseSkill(text,fallback);
 const item={id:"skill-"+slug(s.name),type:"skill",name:s.name,cat:targetBranch(),group:"",desc:s.desc,body:text.slice(0,50000),prompt:`Dùng skill "${s.name}" để …`,added:new Date().toISOString()};
 if(cfg.provider!=="none"){$("#st").textContent=t("summarizing")+" "+s.name;await aiFill(item,"skill",text)}
 addItem(item);return s.name}
$("#skillBtn").onclick=()=>busy($("#skillBtn"),async()=>{const txt=$("#skillTxt").value.trim();if(!txt)return toast(t("needSkill"));
 const n=await addSkillText(txt);$("#skillTxt").value="";$("#st").textContent="";toast(t("saved")+": "+n)});
$("#skillFile").onchange=e=>busy($("#skillBtn"),async()=>{const fs=[...e.target.files];e.target.value="";let n=0;
 for(const f of fs){const dir=(f.webkitRelativePath||"").split("/").slice(-2,-1)[0];await addSkillText(await f.text(),dir||f.name.replace(/\.(md|markdown|txt)$/i,"").replace(/^SKILL$/i,""));n++}
 $("#st").textContent="";toast(t("saved")+": "+n+" skill")});

/* ---------- add: other link ---------- */
$("#lkBtn").onclick=()=>{const name=$("#lkName").value.trim(),url=$("#lkUrl").value.trim(),desc=$("#lkDesc").value.trim();
 if(!name)return toast(t("needName"));if(url&&!/^https?:\/\/\S+\.\S+/.test(url))return toast(t("badUrl"));
 addItem({id:"tool-"+slug(name),type:"tool",name,url,desc,cat:targetBranch(),group:"",prompt:url?`Dùng ${name} (${url}) để …`:`Dùng ${name} để …`,added:new Date().toISOString()});
 ["#lkName","#lkUrl","#lkDesc"].forEach(s=>$(s).value="");toast(t("saved")+": "+name)};

/* ---------- export ---------- */
let XF="agents";
function toAgents(){let s=`# Tool library

This file lists the repos, skills and tools I keep for my work, sorted into branches (fields of work). Before suggesting or building something from scratch, check this list for a tool that already fits. If one fits, say which one and why, then clone it (for repos) and read its README, or follow the skill's instructions, before using it. Do not assume a tool does something its entry does not say.
`;
 LIB.branches.forEach(b=>{const A=LIB.items.filter(i=>catOf(i)===b.id);if(!A.length)return;s+=`\n## ${b.name}\n`;
  [...new Set(A.map(i=>i.group||"General"))].forEach(g=>{s+=`\n### ${g}\n`;A.filter(i=>(i.group||"General")===g).forEach(i=>{
   s+=`\n- **${i.name}** (${i.type||"repo"})${i.url?` — ${i.url}`:""}\n`;if(i.desc)s+=`  - What: ${i.desc}\n`;if(i.when)s+=`  - When: ${i.when}\n`;if(i.install)s+=`  - Install: \`${i.install}\`\n`;(i.points||[]).forEach(p=>s+=`  - ${p}\n`)})})});
 return s+`\n---\nGenerated by tinilib — https://github.com/tvtinhofficial/tini-library\n`}
function toLlms(){return `# Tool library\n\n> Repos, skills and tools I use, by field of work.\n`+LIB.branches.map(b=>{const A=LIB.items.filter(i=>catOf(i)===b.id);return A.length?`\n## ${b.name}\n\n`+A.map(i=>`- [${i.name}](${i.url||"#"}): ${i.desc||""}`).join("\n")+"\n":""}).join("")}
function showExport(f){XF=f;$("#x-out").value=f==="agents"?toAgents():f==="llms"?toLlms():JSON.stringify(LIB,null,2)}
$("#x-copy").onclick=()=>cp($("#x-out").value);
$("#x-dl").onclick=()=>download(XF==="agents"?"AGENTS.md":XF==="llms"?"llms.txt":"library.json",$("#x-out").value);

/* ---------- boot ---------- */
async function loadLib(){
 let d=ls.get(LS.data,null);
 if(!d){try{const r=await fetch("library.json",{cache:"no-store"});if(r.ok)d=await r.json()}catch(e){}}
 LIB=normalize(d);render()}
loadCfg();applyLang();loadLib();
</script></body></html>
